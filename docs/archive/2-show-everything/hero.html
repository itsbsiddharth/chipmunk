<!doctype html>
<!-- README hero (docs/img/hero.png). Rendered at 2x by tools/shots.mjs. -->
<html><head><meta charset="utf-8"><title>Chipmunk hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #f7f6f2; font-family: Inter, "Segoe UI", sans-serif; color: #1d1b18; position: relative; }
  .glow { position: absolute; right: -160px; top: -220px; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(closest-side, rgba(233, 178, 129, .36), transparent 70%); }
  .copy { position: absolute; left: 110px; top: 150px; width: 720px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: -.01em; }
  .brand img { width: 52px; height: 52px; border-radius: 13px; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 112px; line-height: .95; letter-spacing: -.02em; margin: 44px 0 30px; }
  h1 em { color: #b5602a; }
  p { font-size: 27px; line-height: 1.5; color: #57534b; margin: 0 0 40px; max-width: 640px; }
  .keys { display: flex; gap: 12px; flex-wrap: wrap; }
  .key { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #e6e2d9; border-radius: 14px; padding: 10px 16px 10px 12px; font-size: 18px; color: #57534b; }
  kbd { font: 600 15px Inter, "Segoe UI", sans-serif; background: #f1efe9; border: 1px solid #d5d0c4; border-bottom-width: 3px; border-radius: 7px; padding: 4px 8px; color: #1d1b18; }
  .shot { position: absolute; right: 130px; top: 40px; width: 470px; height: 820px; border-radius: 22px; overflow: hidden; box-shadow: 0 40px 90px rgba(60, 40, 20, .24), 0 4px 14px rgba(60, 40, 20, .08); border: 1px solid #e6e2d9; background: #fff; }
  .shot img { display: block; width: 100%; }
  .chip { position: absolute; right: 585px; bottom: 26px; width: 190px; filter: drop-shadow(0 18px 24px rgba(60, 40, 20, .22)); }
</style></head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand"><img src="img/icon.png" alt="">Chipmunk</div>
    <h1>Show your AI<br><em>everything.</em></h1>
    <p>Screenshots, files and notes, into ChatGPT, Claude, Claude Code, Codex or Cursor in one paste. Numbered, in order, with your notes attached.</p>
    <div class="keys">
      <div class="key"><kbd>Win+Shift+S</kbd> Screenshot as usual</div>
      <div class="key"><kbd>Ctrl+Enter</kbd> Send it all</div>
    </div>
  </div>
  <div class="shot"><img src="img/panel-light.png" alt=""></div>
  <img class="chip" src="img/chip.png" alt="">
</body></html>
