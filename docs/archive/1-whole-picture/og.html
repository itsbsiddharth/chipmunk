<!doctype html>
<html><head><meta charset="utf-8"><title>Chipmunk social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f7f6f2; font-family: Inter, "Segoe UI", sans-serif; color: #1d1b18; position: relative; }
  .glow { position: absolute; right: -160px; top: -200px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(233, 178, 129, .38), transparent 70%); }
  .copy { position: absolute; left: 76px; top: 92px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 28px; letter-spacing: -.01em; }
  .brand img { width: 48px; height: 48px; border-radius: 12px; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 96px; line-height: .95; letter-spacing: -.02em; margin: 40px 0 26px; }
  h1 em { color: #b5602a; }
  p { font-size: 26px; line-height: 1.4; color: #57534b; margin: 0; max-width: 540px; }
  .pill { position: absolute; left: 76px; bottom: 64px; display: inline-flex; align-items: center; gap: 12px; background: #1d1b18; color: #fff; font-weight: 600; font-size: 22px; padding: 14px 24px; border-radius: 999px; }
  .pill svg { width: 22px; height: 22px; fill: #fff; }
  .pill span { color: #c9c3b8; font-weight: 500; }
  .shot { position: absolute; right: 64px; top: 54px; width: 360px; height: 600px; border-radius: 22px; overflow: hidden; border: 1px solid #e6e2d9; box-shadow: 0 40px 90px rgba(60, 40, 20, .25), 0 4px 14px rgba(60, 40, 20, .08); background: #fff; }
  .shot img { width: 100%; display: block; }
  .chip { position: absolute; right: 360px; bottom: 26px; width: 170px; filter: drop-shadow(0 18px 24px rgba(60, 40, 20, .25)); }
</style></head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand"><img src="../site/assets/icon-256.png" alt="">Chipmunk</div>
    <h1>Give your AI<br><em>the whole picture.</em></h1>
    <p>Screenshots, files and notes in one draft. One click pastes it all into any AI.</p>
  </div>
  <div class="pill"><svg viewBox="0 0 24 24"><path d="M3 5.3l7.4-1v7.2H3V5.3zm8.3-1.2L21 2.8v8.7h-9.7V4.1zM3 12.5h7.4v7.2L3 18.7v-6.2zm8.3 0H21v8.7l-9.7-1.3v-7.4z"/></svg>Free for Windows <span>· chipmunk.bsid.dev</span></div>
  <div class="shot"><img src="../site/assets/panel-light.webp" alt=""></div>
  <img class="chip" src="../site/assets/chip.png" alt="">
</body></html>
