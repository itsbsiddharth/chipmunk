<!doctype html>
<html><head><meta charset="utf-8"><title>Acme sign in</title>
<style>
  body { margin: 0; font: 15px/1.5 "Segoe UI", sans-serif; background: #eef1f6; color: #172033; }
  .phone { width: 375px; height: 700px; margin: 0 auto; background: #fff; position: relative; overflow: hidden; }
  header { padding: 18px 22px; font-weight: 700; font-size: 18px; border-bottom: 1px solid #e6e9ef; }
  main { padding: 28px 22px; }
  h1 { font-size: 24px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: #556; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cfd5df; border-radius: 8px; font: inherit; }
  .btn { position: absolute; left: 22px; right: 22px; bottom: 34px; padding: 14px; background: #3d5afe; color: #fff; border-radius: 10px; text-align: center; font-weight: 700; z-index: 2; }
  footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 22px; background: #172033; color: #c9d1e4; font-size: 13px; height: 70px; }
  .bug { position: absolute; left: 14px; right: 14px; bottom: 26px; height: 64px; border: 3px solid #ff3b30; border-radius: 12px; z-index: 3; }
</style></head>
<body><div class="phone">
  <header>acme</header>
  <main>
    <h1>Welcome back</h1>
    <label>Email</label><input value="sam@acme.dev">
    <label>Password</label><input type="password" value="hunter22">
  </main>
  <div class="btn">Sign in</div>
  <footer>© Acme Inc · Privacy · Terms · Help center</footer>
  <div class="bug"></div>
</div></body></html>
